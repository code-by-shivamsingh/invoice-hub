spring.application.name=InvoiceHub
server.port=8085

# MongoDB connection URI
spring.mongodb.uri=mongodb://localhost:27017/app-jokati--local

# Optional: Connection pool settings
spring.data.mongodb.auto-index-creation=true


# Global log level
logging.level.root=INFO

# Set log level for a specific package
logging.level.com.jokati.invoice=DEBUG


# ========= Console Formatting =========
# Customize console log pattern (date, level, logger, thread, message)
logging.pattern.console=%d{ISO8601} [%thread] [%X{traceId}] [%X{application}] %-5level %logger{36} - %msg%n

# ========= File Output =========
# Single file output (no rolling). For rolling, use logback-spring.xml (see note below)
logging.file.name=logs/jokati-app.log

# Customize file log pattern
logging.pattern.file=%d{ISO8601} [%thread] [%X{traceId}] [%X{application}] %-5level %logger{36} - %msg%n

# ========= Color (console) =========
# Enabled by default on supported terminals; force enable/disable as needed
# spring.output.ansi.enabled=ALWAYS

# ========= Actuator (optional for dynamic log level) =========
# Expose loggers endpoint to change levels at runtime
management.endpoints.web.exposure.include=loggers,health,info
management.endpoint.loggers.enabled=true




# application.properties
spring.mail.host=smtp.yourmailserver.com
spring.mail.port=587
spring.mail.username=your_email@example.com
spring.mail.password=your_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

